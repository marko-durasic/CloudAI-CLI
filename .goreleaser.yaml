# .goreleaser.yaml
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cloudai
    main: ./cmd/cloudai
    binary: cloudai
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/ddjura/cloudai/internal/version.Version={{.Version}}
      - -X github.com/ddjura/cloudai/internal/version.Commit={{.Commit}}
      - -X github.com/ddjura/cloudai/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
