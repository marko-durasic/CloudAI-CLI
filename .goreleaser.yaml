# .goreleaser.yaml
version: 2

project_name: cloudai

before:
  hooks:
    - go mod download

builds:
  - id: cloudai
    main: ./cmd/cloudai
    binary: cloudai
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/marko-durasic/CloudAI-CLI/internal/version.Version={{.Version}}
      - -X github.com/marko-durasic/CloudAI-CLI/internal/version.Commit={{.Commit}}
      - -X github.com/marko-durasic/CloudAI-CLI/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    # Fixed filename (no {{ .Version }}) so /releases/latest/download/ works.
    # title .Os + amd64→x86_64 matches README curl: cloudai_Linux_x86_64.tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
